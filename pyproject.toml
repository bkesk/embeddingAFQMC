[build-system]
requires = [
	 "numpy",
	 "h5py",
	 "pyscf",
	 "matplotlib"
]

[project]
name = "embedding_bkesk"
version = "0.0.2"
authors = [
  { name="Kyle Eskridge" },
]
description = "A package for building 2nd quantized embedding Hamiltonians"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/bkesk/embeddingAFQMC"
"Bug Tracker" = "https://github.com/bkesk/embeddingAFQMC/issues"

[project.scripts]
embed = "embedding.__main__:main"
